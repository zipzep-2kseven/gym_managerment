services:
  postgres:
    image: postgres:17-alpine
    container_name: multi_gym_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-multi_gym_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-multi_gym_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - multi_gym_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: multi_gym_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      GALLERY_UPLOAD_DIR: /app/data/gallery-images
      REPORT_UPLOAD_DIR: /app/data/report-images
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-multi_gym_db}?schema=public
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - gallery_images:/app/data/gallery-images
      - report_images:/app/data/report-images
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - multi_gym_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: development
    container_name: multi_gym_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api
    networks:
      - multi_gym_network

volumes:
  gallery_images:
    name: multi_gym_gallery_images
  report_images:
    name: multi_gym_report_images
  postgres_data:
    name: multi_gym_postgres_data

networks:
  multi_gym_network:
    name: multi_gym_network
